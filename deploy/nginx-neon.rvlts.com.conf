server {
    server_name neon.rvlts.com;
    root /var/www/html/neon;
    index index.html;

    # Multijoueur : WebSocket vers le serveur Node (pm2 "neon-dash", port 7100)
    location /ws {
        proxy_pass http://127.0.0.1:7100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # JS/CSS/manifest changent souvent : toujours revalider (304 si inchangé, pas de cache figé)
    location ~* \.(js|css|webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    # Assets vraiment statiques (icônes, sons) : cache long
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp3|ogg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/neon.rvlts.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/neon.rvlts.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = neon.rvlts.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name neon.rvlts.com;
    return 404; # managed by Certbot


}
